# The HACS Action, one of the two checks HACS requires before a repository is added to its default
# list. It must pass with no errors and no ignores; the hacs/default pull request links to its run.
name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
