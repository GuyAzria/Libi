};
const SCHEDULE = 'schedule.lvkh_zmnym_lhshqyyt_gynh';
const SPAN = [{ from: '06:00:00', to: '06:30:00' }];
const SCHEDULES = [{ id: 'lvkh_zmnym_lhshqyyt_gynh', name: 'Garden schedule', icon: 'mdi:sprinkler',
  monday: [], tuesday: SPAN, wednesday: [], thursday: SPAN, friday: [], saturday: [], sunday: SPAN }];

const sent = [];
const hass = {
  states: { [SCHEDULE]: { entity_id: SCHEDULE, state: 'off', attributes: { friendly_name: 'Garden schedule' } } },
  entities: {}, devices: {}, areas: {}, themes: { darkMode: false }, language: 'en',
  user: { is_admin: true }, localize: (k) => k, callService: async () => {},
  connection: {
    sendMessagePromise: async (m) => {
      sent.push(JSON.parse(JSON.stringify(m)));
      if (m.type === 'libi/ai_status') return { configured: false };
      if (m.type === 'libi/project_list') return { projects: [] };
      if (m.type === 'schedule/list') return SCHEDULES;
      // [CHANGED 2026-11-04, v3.85.0] SAVE & COMPILE: compile, Home Assistant's config API, then what reached it.
      if (m.type === 'libi/compile_project') return { ok: true, errors: [], upserts: [], removals: [], unchanged: 1, stamp: 's' };
      if (m.type === 'libi/save_done') return { status: 'ok', saved: true, message: 'Saved.', written: [], reloaded: [], errors: [] };
      if (m.type === 'libi/verify_automation') return { results: [], ok: true };
      if (m.type === 'libi/preview_yaml') return { yaml: '' };
      return [];
    },
    subscribeEvents: async () => () => {}, subscribeMessage: async () => () => {},
  },
};

try {
  localStorage.clear();
  const panel = document.createElement('libi-panel');
  panel.style.height = '800px';
  document.body.appendChild(panel);
  panel.hass = hass;
  await sleep(300);
  const sr = panel.shadowRoot;
  const core = panel.core;
  core.nets = [DRAWN.net4, DRAWN.two, DRAWN.ladder, DRAWN.forhead].map(n => JSON.parse(JSON.stringify(n)));
  core.syncCounters();
  core.repairAST();
  core.validateAST();
  panel._project = { slug: 'p', name: 'P' };
  panel._render(); await sleep(50);

  const net = core.nets[0];
  const [r1, r2, r3, r4] = net.rungs;
  const inNet = (sel, n = net) => [...sr.querySelectorAll(`.libi-el${sel}[data-nid="${n.id}"]`)];
  check('the trigger is drawn once', inNet('.is-trigger').length === 1, inNet('.is-trigger').length);
  check('the three rungs below hang from it', net.rungs.length === 4 && [r2, r3, r4].every(r => r.sharesHead && core.hangs(r))
        && !core.hangs(r1) && [r2, r3, r4].every(r => core.headIndex(net, net.rungs.indexOf(r)) === 0));

  // The drop: a vertical line under the dot after the trigger, down to every rung below; each starts there.
  const L = panel._netLayout[net.id];
  const after = L.dotIndex[`${r1.id}|1`];
  const x = after.x + Math.round(core.LAY.DOT / 2);
  const base = (r) => L.rungs.find(b => b.id === r.id).baseY;
  const drops = L.lines.filter(l => l.x1 === x && l.x2 === x && l.y1 !== l.y2);
  const covers = (y) => drops.some(l => Math.min(l.y1, l.y2) <= y && y <= Math.max(l.y1, l.y2));
  check('a drop comes down from the trigger to every rung below it', covers(base(r1)) && [r2, r3, r4].every(r => covers(base(r))),
        JSON.stringify({ x, drops, bases: [r1, r2, r3, r4].map(base) }));
  check('each rung below starts at the drop, not at the rail', [r2, r3, r4].every(r => L.dotIndex[`${r.id}|0`].x === after.x
        && !L.lines.some(l => l.y1 === base(r) && l.y2 === base(r) && Math.min(l.x1, l.x2) < x)),
        JSON.stringify([r2, r3, r4].map(r => L.dotIndex[`${r.id}|0`].x)));
  const trigBox = sr.querySelector(`.libi-el[data-nid="${net.id}"][data-eid="${r1.elements[0].id}"]`).getBoundingClientRect();
  const firstBox = sr.querySelector(`.libi-el[data-nid="${net.id}"][data-eid="${r2.elements[0].id}"]`).getBoundingClientRect();
  check('the first block of a hanging rung sits right of the trigger', firstBox.left > trigBox.right, `${firstBox.left} ${trigBox.right}`);
  check('no block is red, the wait that ends rung 2 included', inNet('.has-error').length === 0,
        inNet('.has-error').map(e => e.textContent.trim().slice(0, 80)).join(' | '));

  // The schedule's days and hours, on the block and in the inspector.
  const trig = r1.elements[0];
  const note = sr.querySelector(`.libi-el[data-nid="${net.id}"][data-eid="${trig.id}"] .plc-note`);
  check('the CMP DATETIME block says the days and hours of the schedule', !!note && note.textContent === 'Tue Thu Sun 06:00–06:30',
        note && note.textContent);
  panel._schedules.other = { id: 'other', monday: SPAN, thursday: [{ from: '07:00:00', to: '07:15:00' }] };
  panel._schedules.empty = { id: 'empty' };
  check('hours that differ by day are said day by day', panel._scheduleText('schedule.other') === 'Mon 06:00–06:30 · Thu 07:00–07:15'
        && panel._scheduleText('schedule.empty') === 'no days marked yet' && panel._scheduleText('schedule.unknown') === '',
        [panel._scheduleText('schedule.other'), panel._scheduleText('schedule.empty')].join(' | '));
  panel._inspectedEl = { netId: net.id, rungId: r1.id, elId: trig.id };
  panel._render();
  const insp = [...sr.querySelectorAll('.insp-note')].map(n => n.textContent.trim());
  check('the inspector says the days and hours and where they are set', insp[0] === 'Tue Thu Sun 06:00–06:30'
        && /Helpers/.test(insp[1] || ''), JSON.stringify(insp));
  panel._inspectedEl = null;
  panel._render(); await sleep(20);

  // Online: the rungs below have power only while the trigger has. [CHANGED v1.1.0] The online engine keeps its
  // results per NET since LIBI 3.93.0 (two NETs opened from Home Assistant share r1, e1 ...): rungPowerOf(net, rung).
  const online = panel.online;
  hass.states[SCHEDULE].state = 'off';
  online.update([net], hass);
  check('online, with the schedule off, the rungs below the trigger have no power', [r2, r3, r4].every(r => online.rungPowerOf(net.id, r.id) === false),
        JSON.stringify([r2, r3, r4].map(r => online.rungPowerOf(net.id, r.id))));
  hass.states[SCHEDULE].state = 'on';
  online.update([net], hass);
  const own = [r2, r3, r4].map(r => online.evaluateSeries(r.elements, hass, Date.now(), net.id));
  online.update([net], hass);
  check('with it on, each has what its own blocks give', online.rungPowerOf(net.id, r1.id) === true
        && [r2, r3, r4].every((r, i) => online.rungPowerOf(net.id, r.id) === own[i]), JSON.stringify(own));
  hass.states[SCHEDULE].state = 'off';

  // A rung opened among them hangs too, so the ones below keep their trigger.
  core.openBranchAt(net.id, r3.id, '0');
  check('a rung opened below a hanging rung hangs from the trigger too', net.rungs.length === 5 && net.rungs[3].sharesHead === true
        && core.hangs(net.rungs[3]) && core.headIndex(net, 4) === 0);
  net.rungs.splice(3, 1);
  core.openBranchAt(net.id, r1.id, '0');
  check('and one opened right above a hanging rung', net.rungs[1].sharesHead === true && core.headIndex(net, 4) === 0);
  net.rungs.splice(1, 1);

  // With no trigger above, a hanging rung is red and nothing is saved.
  const head = r1.elements.shift();
  core.validateAST(); panel._render(); await sleep(20);
  check('without a trigger above it, a hanging rung is red', /hangs from the trigger above it/.test(r2.elements[0].structuralError || ''),
        r2.elements[0].structuralError);
  let before = sent.length;
  let res = await panel._saveProject();
  check('and the save is refused', res.refused === true && !sent.slice(before).some(m => m.type === 'libi/compile_project'), JSON.stringify(res));
  r1.elements.unshift(head);
  core.validateAST(); panel._render(); await sleep(20);

  // As drawn it saves, and the backend is told which rungs hang, so it gives them the trigger back.
  before = sent.length;
  res = await panel._saveProject();
  const save = sent.slice(before).find(m => m.type === 'libi/compile_project');
  const saved = save && save.nets.find(n => n.id === net.id);
  check('as drawn it saves, and says which rungs hang from the trigger', res.saved === true && !!saved
        && saved.rungs.slice(1).every(r => r.sharesHead === true && !r.elements.some(e => e.isTrigger)), JSON.stringify(res));

  // Two triggers are one rung per trigger joined by a link; the rungs below come down from that link.
  const two = core.nets[1];
  const L2 = panel._netLayout[two.id];
  const link = L2.lines.find(l => l.link);
  const hanging = two.rungs.filter(r => core.hangs(r));
  check('with two triggers, the drop comes down from the link that joins them', !!link && hanging.length === 3
        && hanging.every(r => L2.dotIndex[`${r.id}|0`].x + Math.round(core.LAY.DOT / 2) === link.x1)
        && inNet('.is-trigger', two).length === 2 && inNet('.has-error', two).length === 0,
        JSON.stringify({ link: link && link.x1, xs: hanging.map(r => L2.dotIndex[`${r.id}|0`].x) }));

  // The ladder way, as the user's own automations are: every rung starts with its own trigger and none hangs; the
  // time limit is its trigger and the TON of its for.
  const ladder = core.nets[2];
  check('the ladder way: every rung starts with its own trigger, none hangs, none is red', ladder.rungs.length === 4
        && ladder.rungs.every(r => core.triggerHead(r) && !core.hangs(r)) && inNet('.is-trigger', ladder).length === 4
        && inNet('.has-error', ladder).length === 0, inNet('.has-error', ladder).map(e => e.textContent.trim().slice(0, 60)).join(' | '));
  const limitRung = ladder.rungs[2];
  check('the time limit is its trigger with the TON of its for', limitRung.elements[0].isTrigger
        && limitRung.elements[1].type === 'timer_ton' && limitRung.elements[1].isFor && core.headLength(limitRung) === 2);
  // A trigger with a for: the rung below comes down after its TON.
  const fh = core.nets[3];
  const L3 = panel._netLayout[fh.id];
  const afterTon = L3.dotIndex[`${fh.rungs[0].id}|2`];
  check('the drop comes down after the TON of the for of the trigger', core.hangs(fh.rungs[1]) && !!afterTon
        && L3.dotIndex[`${fh.rungs[1].id}|0`].x === afterTon.x && inNet('.has-error', fh).length === 0,
        JSON.stringify({ after: afterTon && afterTon.x, hang: L3.dotIndex[`${fh.rungs[1].id}|0`].x }));
} catch (err) {
  results.push({ name: 'harness threw', ok: false, detail: String(err && err.stack || err) });
}
const failed = results.filter(r => !r.ok);
document.getElementById('out').textContent = JSON.stringify({ passed: results.length - failed.length, failed }, null, 1);
</script>
