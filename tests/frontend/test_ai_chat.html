<!doctype html>
<html><head><meta charset="utf-8"><title>libi-ai behaviour test</title></head>
<body>
<div id="mount" style="width:320px"></div>
<pre id="out">RUNNING</pre>
<script type="module">
import { LibiAiChat } from '../../custom_components/libi/frontend/libi-ai.js';
// The panel's real styles, so a layout check measures what the sidebar shows.
import { getStyles } from '../../custom_components/libi/frontend/libi-css.js';
// [ADDED 2026-11-01] The user's own words, in Hebrew as they wrote them, are data (CLAUDE.md RULE 17: English only in
// the code); the same file the Python tests read.
import HE from '../fixtures/user_text_he.json' with { type: 'json' };
document.head.appendChild(Object.assign(document.createElement('style'), { textContent: getStyles() }));

const results = [];
const check = (name, cond, detail = '') => results.push({ name, ok: !!cond, detail: cond ? '' : String(detail) });
const tick = () => new Promise(r => setTimeout(r, 0));

const XSS = '<img src=x onerror="window.pwned=1">';
const PLAN = {
  plan: {
    reply: 'Pick the buttons <b>and</b> the lights.', level: 'automation', name: 'Salon 10 min',
    roles: [
      { id: 'trigger_buttons', label: 'Buttons', purpose: 'trigger', domains: ['input_button'], device_classes: [], keywords: [], area_keywords: [] },
      { id: 'salon_lights', label: 'Salon lights', purpose: 'target', domains: ['light'], device_classes: [], keywords: [], area_keywords: [] },
    ],
    questions: [{ id: 'duration', text: 'How long?', choices: ['10 minutes', '20 minutes'] }],
  },
  candidates: {
    trigger_buttons: { exact: true, items: [
      { entity_id: 'input_button.a', name: XSS, area: 'Hall', state: 'unknown' },
      { entity_id: 'input_button.b', name: 'Button B', area: '', state: 'unknown' } ] },
    salon_lights: { exact: true, items: [{ entity_id: 'light.salon', name: 'Salon', area: 'Salon', state: 'off' }] },
  },
};
const BUILD = {
  ok: true, errors: [], level: 'automation', reply: 'Built it.', notes: ['Check the delay.'],
  yaml: 'alias: x\n</pre><img src=x onerror="window.pwned=1">', card_yaml: 'type: entities\n', sensitive: [],
  round_trip: { ok: true, issues: [] },
  net: { id: 'n_libi_ai_1', ha_id: 'libi_ai_1', name: 'Salon 10 min', level: 'automation', rungs: [] },
};
let responses = { 'libi/ai_status': { configured: true, mode: 'cloud', provider: 'gemini', model: 'gemini-x' },
                  'libi/ai_plan': PLAN, 'libi/ai_build': BUILD,
                  'libi/verify_automation': { results: [{ id: 'libi_ai_1', ok: true, issues: [] }], ok: true } };
const calls = [];
// [v3.67.0] The panel's SAVE & COMPILE, as the chat calls it after adding a NET: what it was given, what it answers.
const saves = [];
let saveResult = { saved: true, written: ['automation'], reloaded: ['automation'], errors: [], versions: {}, message: 'Saved.' };
const asked = [];
let confirmAnswer = true;
window.confirm = (question) => { asked.push(question); return confirmAnswer; };
const panel = {
  _hass: { connection: { sendMessagePromise: async (m) => { calls.push(JSON.parse(JSON.stringify(m)));
    const r = responses[m.type]; if (r instanceof Error) throw r; return JSON.parse(JSON.stringify(r)); } },
    states: { 'automation.salon_10_min': { entity_id: 'automation.salon_10_min', state: 'on', attributes: { id: 'libi_ai_1' } } } },
  core: { nets: [], nid: 5, pushed: 0,
    duplicateNet(n) { const c = JSON.parse(JSON.stringify(n)); c.id = 'n' + this.nid++; c.name = n.name + ' COPY'; c.ha_id = n.ha_id + '_copy'; return c; },
    syncCounters() {}, pushHistory() { this.pushed++; } },
  _projectDirty: false, rendered: 0, _render() { this.rendered++; }, shadowRoot: document,
  async _saveProject() {
    saves.push(JSON.parse(JSON.stringify(this.core.nets)));
    // The real save answers after a round trip to Home Assistant; until then the project is still unsaved.
    await new Promise(r => setTimeout(r, 0));
    if (saveResult.saved !== false) this._projectDirty = false;
    return JSON.parse(JSON.stringify(saveResult));
  },
};

try {
  localStorage.removeItem('libi_ai_open');
  const chat = new LibiAiChat(panel);
  const mount = document.getElementById('mount');
  chat.attach(mount); await tick(); await tick();
  const root = () => mount.querySelector('.ai-chat');
  check('mounted once', mount.children.length === 1);
  check('mount marked open', mount.classList.contains('ai-open'));
  check('status shows model', root().querySelector('.ai-model')?.textContent === 'gemini-x');
  check('hint before first message', !!root().querySelector('.ai-hint'));
  check('privacy line names the provider', root().querySelector('.ai-privacy')?.textContent.includes('Google Gemini'));
  check('privacy line says what is not sent', root().querySelector('.ai-privacy')?.textContent.includes('Your other automations and the rest of your devices are not'));

  chat.draft = 'button turns salon light on for 10 minutes';
  await chat.send();
  check('plan request sent with the message', calls.some(c => c.type === 'libi/ai_plan' && c.messages[0].content.startsWith('button')));
  check('reply shown as text, not HTML', [...root().querySelectorAll('.ai-msg.ai')].some(m => m.textContent.includes('<b>and</b>')) && !root().querySelector('.ai-msg.ai b'));
  check('two role lists', root().querySelectorAll('.ai-role').length === 2);
  check('device name with HTML shown as text', [...root().querySelectorAll('.ai-item-name')].some(n => n.textContent === XSS));
  check('single exact light preselected', chat.selections.salon_lights.has('light.salon'));
  const build = () => root().querySelector('.ai-build');
  check('build disabled until buttons picked', build().disabled === true);

  root().querySelector('.ai-list[data-role="trigger_buttons"] input[value="input_button.b"]').click();
  check('tick selects', chat.selections.trigger_buttons.has('input_button.b'));
  check('build enabled after picking', build().disabled === false);
  check('count updates', root().querySelector('.ai-role .ai-count').textContent === '1 / 2');
  [...root().querySelectorAll('.ai-chip')].find(c => c.textContent === '20 minutes').click();
  check('chip answers the question', chat.answers.duration === '20 minutes');
  check('chosen chip marked', [...root().querySelectorAll('.ai-chip.on')].map(c => c.textContent).join() === '20 minutes');

  build().click(); await tick(); await tick(); await tick();
  const b = calls.find(c => c.type === 'libi/ai_build');
  check('build sends selections as arrays', b && JSON.stringify(b.selections) === JSON.stringify({ trigger_buttons: ['input_button.b'], salon_lights: ['light.salon'] }), b && JSON.stringify(b.selections));
  check('build sends answers', b && b.answers.duration === '20 minutes');
  check('plan cleared after a good build', chat.plan === null && !root().querySelector('.ai-plan'));
  check('yaml shown as text', root().querySelector('.ai-yaml pre')?.textContent.includes('</pre><img'));
  check('card yaml shown', root().querySelector('.ai-card pre')?.textContent === 'type: entities\n');

  // [v3.59.0] New logic goes into the next NET, and the button says which. [v3.67.0] Adding saves and compiles it.
  check('the add button names the next NET and says it saves', root().querySelector('.ai-add').textContent === 'Add as NET 1, save and compile', root().querySelector('.ai-add').textContent);
  root().querySelector('.ai-add').click();
  check('net added to the canvas', panel.core.nets.length === 1);
  check('net keeps its name and ha_id', panel.core.nets[0].name === 'Salon 10 min' && panel.core.nets[0].ha_id === 'libi_ai_1', JSON.stringify(panel.core.nets[0]));
  check('net gets a fresh canvas id', panel.core.nets[0].id === 'n5');
  check('history pushed, project dirty, panel rendered', panel.core.pushed === 1 && panel._projectDirty === true && panel.rendered === 1);
  check('while it saves, the chat says so', !!root().querySelector('.ai-save-saving') && root().querySelector('.ai-save').textContent.includes('Saving and compiling'));
  for (let i = 0; i < 6; i++) await tick();
  check('adding saves and compiles at once, the new NET included', saves.length === 1 && saves[0].length === 1 && saves[0][0].ha_id === 'libi_ai_1');
  check('the add button says where it went', root().querySelector('.ai-add').textContent === 'Added as NET 1');
  check('add button disabled after adding', root().querySelector('.ai-add').disabled === true);
  const said = [...root().querySelectorAll('.ai-save .ai-note')].map(n => n.textContent);
  check('the chat says what the save did, line by line', !!root().querySelector('.ai-save-saved') && said.join('|') === [
    '✓ Home Assistant wrote automations.yaml.', '✓ Reloaded in Home Assistant (automation).',
    '✓ Read back from automations.yaml, the ladder draws it exactly as built.',
    '✓ automation.salon_10_min is on in Home Assistant.'].join('|'), said.join('|'));
  check('the saved automation is read back by its id', calls.filter(c => c.type === 'libi/verify_automation').pop()?.automation_id === 'libi_ai_1');

  // rejected draft
  responses['libi/ai_build'] = { ok: false, errors: ['The draft names light.kitchen, which you did not pick.'] };
  chat.draft = 'also the kitchen'; await chat.send();
  build().click(); await tick(); await tick(); await tick();
  check('rejected draft shows the reasons', [...root().querySelectorAll('.ai-msg.error li')].some(li => li.textContent.includes('light.kitchen')));
  check('rejected draft adds nothing', panel.core.nets.length === 1);

  // transport error
  responses['libi/ai_plan'] = Object.assign(new Error('The AI could not be reached.'), { code: 'ai_error' });
  chat.draft = 'again'; await chat.send();
  check('ws error shown', [...root().querySelectorAll('.ai-msg.error')].some(m => m.textContent.includes('could not be reached')));
  check('not busy after error', chat.busy === '' && root().querySelector('.ai-send').disabled === false);

  // re-render of the panel moves, not rebuilds
  const before = root();
  const mount2 = document.createElement('div'); document.body.appendChild(mount2);
  chat.attach(mount2);
  check('same root moved to the new mount', mount2.firstChild === before && mount.children.length === 0);

  // collapse
  chat._toggle();
  check('collapsed hides the body', !before.querySelector('.ai-body') && !mount2.classList.contains('ai-open'));
  check('collapse remembered', localStorage.getItem('libi_ai_open') === '0');
  chat._toggle();

  // not configured
  responses['libi/ai_status'] = { configured: false };
  const chat2 = new LibiAiChat(panel); const m3 = document.createElement('div'); document.body.appendChild(m3);
  chat2.attach(m3); await tick(); await tick();
  check('not configured shows the settings path', m3.querySelector('.ai-path')?.textContent.includes('Configure'));
  check('not configured has no input', !m3.querySelector('.ai-input'));


  // ---------------------------------------------------------------- the nets on the page (v3.40.0)
  panel.core.nets = [{ id: 'n_garden', ha_id: 'garden_watering', name: 'Garden', level: 'automation', rungs: [] }];
  panel._projectDirty = false;
  const lastCall = (type) => calls.filter(c => c.type === type).pop();

  chat._reset();
  check('privacy line says the nets on the page and the helpers are sent while sharing', chat.root.querySelector('.ai-privacy')?.textContent.includes('the nets open on this page, your helpers'));
  check('the switch says what it shares', chat.root.querySelector('.ai-share')?.textContent.includes('Share the nets on this page and my helpers'));
  responses['libi/ai_plan'] = { plan: { reply: 'It waters 50 litres when you press the button.', intent: 'answer',
    target_net: '', level: 'automation', name: '', roles: [], questions: [] }, candidates: {}, preselect: {} };
  chat.draft = 'what does the garden net do?'; await chat.send();
  check('the nets on the page are sent while sharing', lastCall('libi/ai_plan').nets.length === 1 && lastCall('libi/ai_plan').nets[0].id === 'n_garden');
  check('the share flag is sent with the plan', lastCall('libi/ai_plan').share === true);
  check('a question is answered in the chat', [...chat.root.querySelectorAll('.ai-msg.ai')].some(m => m.textContent.includes('50 litres')));
  check('a question shows nothing to pick or build', !chat.root.querySelector('.ai-plan') && !chat.root.querySelector('.ai-build'));

  chat.root.querySelector('#aiShareNets').click();
  check('the share switch turns off and is remembered', chat.shareNets === false && localStorage.getItem('libi_ai_share') === '0');
  chat.draft = 'and now?'; await chat.send();
  check('the nets are not sent when not shared', lastCall('libi/ai_plan').nets.length === 0);
  check('the share flag is off when not shared', lastCall('libi/ai_plan').share === false);
  chat._reset();
  check('privacy line without sharing says automations are not sent', chat.root.querySelector('.ai-privacy')?.textContent.includes('Your automations'));
  chat.root.querySelector('#aiShareNets').click();
  check('the share switch turns back on', chat.shareNets === true);

  responses['libi/ai_plan'] = {
    plan: { reply: 'I will change the garden.', intent: 'modify', target_net: 'n_garden', level: 'automation', name: 'Garden',
      roles: [{ id: 'valve', label: 'Valve', purpose: 'target', domains: ['switch'], device_classes: [], keywords: [], area_keywords: [] }],
      questions: [] },
    candidates: { valve: { exact: true, items: [
      { entity_id: 'switch.garden_valve', name: 'Garden valve', area: '', state: 'off', current: true },
      { entity_id: 'switch.other', name: 'Other', area: '', state: 'off', on_canvas: 'NET 2 · Kitchen' }] } },
    preselect: { valve: ['switch.garden_valve'] } };
  // [v3.59.0] NET 1 runs version 2; a change becomes version 3 and version 2 stays.
  panel._versions = { n_garden: { active: 2, latest: 2, count: 2 } };
  chat.draft = 'update NET 1: water on four mornings instead of the button'; await chat.send();
  check('a change names the net it changes by its number', chat.root.querySelector('.ai-plan-title')?.textContent.includes('Change: NET 1 · Garden'), chat.root.querySelector('.ai-plan-title')?.textContent);
  check('the device already in the net is ticked', chat.selections.valve.has('switch.garden_valve') && !chat.selections.valve.has('switch.other'));
  check('the device already in the net is marked current', !!chat.root.querySelector('.ai-current'));
  const netTag = chat.root.querySelector('.ai-on-canvas');
  check('a device another net on the page uses names that net', !!netTag && netTag.textContent === 'NET 2' && netTag.title === 'Used in NET 2 · Kitchen', netTag && netTag.outerHTML);
  check('a device used on the page is offered, not ticked', !chat.selections.valve.has('switch.other'));

  responses['libi/ai_build'] = { ok: true, errors: [], level: 'automation', reply: 'Changed.', notes: [], yaml: 'alias: Garden',
    card_yaml: '', sensitive: [], round_trip: { ok: true, issues: [] }, intent: 'modify', target_net: 'n_garden',
    net: { id: 'n_libi_x', ha_id: 'garden_watering', name: 'Garden', level: 'automation', rungs: [{ id: 'r1', elements: [] }] } };
  chat.root.querySelector('.ai-build').click(); await tick(); await tick(); await tick();
  check('the build sends the nets too', lastCall('libi/ai_build').nets.length === 1);
  check('the build sends the share flag', lastCall('libi/ai_build').share === true);
  const rep = chat.root.querySelector('.ai-replace');
  check('a change offers Replace NET as the next version, saved and compiled', !!rep
    && rep.textContent === 'Replace NET 1 · Garden - becomes version 3, saved and compiled' && !rep.disabled, rep && rep.textContent);
  check('a change says the version that runs now stays', chat.root.querySelector('.ai-version-note')?.textContent.includes('Version 2 stays in'));
  check('a change can still go into the next NET instead', [...chat.root.querySelectorAll('.ai-add')].pop()?.textContent === 'Add as NET 2, save and compile');
  const netsBefore = panel.core.nets.length;
  saveResult = { ...saveResult, versions: { n_garden: { active: 3, latest: 3, count: 3 } } };
  panel._hass.states['automation.garden'] = { entity_id: 'automation.garden', state: 'on', attributes: { id: 'garden_watering' } };
  responses['libi/verify_automation'] = { results: [{ id: 'garden_watering', ok: true, issues: [] }], ok: true };
  rep.click();
  check('Replace keeps the number of nets', panel.core.nets.length === netsBefore);
  check('Replace keeps the net id and the automation id', panel.core.nets[0].id === 'n_garden' && panel.core.nets[0].ha_id === 'garden_watering',
    JSON.stringify(panel.core.nets[0]));
  check('Replace puts the new version in place', panel.core.nets[0].rungs.length === 1);
  check('Replace marks the project unsaved', panel._projectDirty === true);
  for (let i = 0; i < 6; i++) await tick();
  check('the Replace button says it is done, and as which version', chat.root.querySelector('.ai-replace').disabled && chat.root.querySelector('.ai-replace').textContent.includes('was replaced') && chat.root.querySelector('.ai-replace').textContent.includes('version 3'));
  check('a replace is saved at once, as the next version', saves.length === 2 && saves[1][0].ha_id === 'garden_watering'
    && [...chat.root.querySelectorAll('.ai-save')].pop()?.textContent.includes('Saved as version 3; the one before stays in 🕘 Versions.'));

  responses['libi/ai_build'] = { ...responses['libi/ai_build'], round_trip: { ok: false, issues: ['length .action: 7 to 2'] } };
  chat.draft = 'again'; await chat.send();
  chat.root.querySelector('.ai-build').click(); await tick(); await tick(); await tick();
  const warn = [...chat.root.querySelectorAll('.ai-note.danger')].pop();
  check('a draft the ladder cannot hold is said to change on saving', !!warn && warn.textContent.includes('would change it') && warn.textContent.includes('7 to 2'));
  // [v3.67.0] Such a draft is added, not saved on its own.
  const holdBtn = [...chat.root.querySelectorAll('.ai-add')].pop();
  check('a draft the ladder would change does not save on its own', holdBtn.textContent === 'Add as NET 2 to the canvas', holdBtn.textContent);
  const savesHeld = saves.length;
  holdBtn.click(); for (let i = 0; i < 4; i++) await tick();
  check('adding it holds the save and says why', saves.length === savesHeld
    && [...chat.root.querySelectorAll('.ai-save')].pop()?.textContent.includes('Not saved: the ladder would change this draft'));
  panel.core.nets.pop(); panel._projectDirty = false;

  // [v3.59.0] A net with no saved version could not be brought back, so the chat does not replace it.
  panel._versions = {};
  responses['libi/ai_build'] = { ...responses['libi/ai_build'], round_trip: { ok: true, issues: [] } };
  chat.draft = 'update NET 1 once more'; await chat.send();
  chat.root.querySelector('.ai-build').click(); await tick(); await tick(); await tick();
  const noVer = [...chat.root.querySelectorAll('.ai-replace')].pop();
  check('no saved version: Replace is not offered', !!noVer && noVer.disabled && noVer.textContent === 'Replace NET 1 · Garden', noVer && noVer.textContent);
  const noVerNote = [...chat.root.querySelectorAll('.ai-version-note')].pop();
  check('no saved version: the chat says why and what to do', !!noVerNote && noVerNote.classList.contains('warn') && noVerNote.textContent.includes('Save the project first'));
  // A long name without spaces wraps inside the 320 px sidebar instead of widening the button. The chat was
  // moved into a mount without a width above, so the sidebar width is set here for the measurement.
  const host = chat.root.parentElement, keepWidth = host.style.width, keepName = panel.core.nets[0].name;
  host.style.width = '320px';
  panel.core.nets[0].name = 'Garden_watering_by_schedule_amount_and_weather_with_a_time_limit';
  chat.render(true);
  const wide = [...chat.root.querySelectorAll('.ai-replace')].pop();
  check('a long NET name wraps inside the button', !!wide && wide.scrollWidth <= wide.clientWidth + 1 && wide.getBoundingClientRect().width <= 321,
    wide && `${wide.scrollWidth} / ${wide.clientWidth} / ${wide.getBoundingClientRect().width}`);
  // The control: without the rule the same name does not fit, so the check above measures the rule.
  wide.style.overflowWrap = 'normal';
  check('without overflow-wrap the long name would not fit', wide.scrollWidth > wide.clientWidth + 1, `${wide.scrollWidth} / ${wide.clientWidth}`);
  wide.style.overflowWrap = '';
  host.style.width = keepWidth;
  panel.core.nets[0].name = keepName;
  chat.render(true);
  const netsKept = JSON.stringify(panel.core.nets);
  chat._replaceOnCanvas(chat.log.filter(e => e.kind === 'result').pop(), 0);
  check('no saved version: a replace does nothing', JSON.stringify(panel.core.nets) === netsKept);

  // [v3.59.0] The model wanted a change of a net the user did not name: the plan says it is new logic.
  responses['libi/ai_plan'] = { plan: { reply: 'I will update the watering.', intent: 'create', target_net: '', forced_new: true,
      level: 'automation', name: 'Garden', roles: [], questions: [] }, candidates: {}, preselect: {} };
  chat.draft = 'water the garden on fixed days'; await chat.send();
  check('a forced new NET says why', [...chat.root.querySelectorAll('.ai-plan .ai-note')].some(n => n.textContent.includes('name it by its number')));
  check('a forced new NET is not a change', !chat.root.querySelector('.ai-plan-title')?.textContent.includes('Change:'));

  // [v3.60.0] A helper the user's message names: an optional role of its own, ticked, tagged, and who else uses it.
  // [CHANGED v3.82.0] A setting is a local variable: a row of the variables window, its helper chosen in a list.
  responses['libi/ai_plan'] = { plan: { reply: 'Pick the valve.', intent: 'create', target_net: '', level: 'automation', name: 'Garden',
      roles: [{ id: 'valve', label: 'Valve', purpose: 'target', domains: ['switch'] },
        { id: 'schedule_garden', label: 'Garden schedule', purpose: 'trigger', domains: ['schedule'], optional: true, named: true, variable: true }],
      questions: [] },
    candidates: { valve: { exact: true, items: [{ entity_id: 'switch.valve', name: 'Valve' }, { entity_id: 'switch.other', name: 'Other' }] },
      schedule_garden: { exact: true, items: [{ entity_id: 'schedule.garden', name: 'Garden schedule', named: true, used_by: ['Old watering', XSS] }] } },
    preselect: { schedule_garden: ['schedule.garden'] } };
  chat.draft = 'water by my helper Garden schedule'; await chat.send();
  check('a helper the message names starts ticked', !!chat.selections.schedule_garden && chat.selections.schedule_garden.has('schedule.garden'));
  const namedRow = () => chat.root.querySelector('.ai-var[data-role="schedule_garden"]');
  check('its row says the message names it, and that it may be left out', !!namedRow() && namedRow().textContent.includes('Not used - your message names it, but leave it out')
    && !namedRow().textContent.includes('NET you named'));
  check('it is tagged named in the list to use, its entity id under it', namedRow()?.querySelector('.ai-var-pick option:checked')?.textContent === 'Garden schedule (named)'
    && namedRow().querySelector('.ai-var-id')?.textContent === 'schedule.garden',
    namedRow() && namedRow().querySelector('.ai-var-pick')?.textContent);
  check('the chat says who else uses it', !!namedRow() && namedRow().textContent.includes('Also used by Old watering, ' + XSS + ': setting it changes it there too.'));
  check('build waits for the valve only', chat.root.querySelector('.ai-build').disabled === true && chat.root.querySelector('.ai-build').title === 'Pick: Valve', chat.root.querySelector('.ai-build').title);
  chat.root.querySelector('.ai-list[data-role="valve"] input[value="switch.valve"]').click();
  check('build is ready with the named helper ticked', chat.root.querySelector('.ai-build').disabled === false);
  namedRow().querySelector('input[type=radio][value="none"]').click();
  check('a named helper left out does not hold build back', !chat.selections.schedule_garden.has('schedule.garden') && chat.root.querySelector('.ai-build').disabled === false);

  // [v3.62.0] A message service the user named that does not exist is said in the plan; a phone role is optional,
  // says why, and is not ticked by itself although it found one exact match.
  responses['libi/ai_plan'] = { plan: { reply: 'Pick the valve.', intent: 'create', target_net: '', level: 'automation', name: 'Garden',
      missing_services: ['notify.mobile_app_mi_9t_pro'],
      roles: [{ id: 'valve', label: 'Valve', purpose: 'target', domains: ['switch'] },
        { id: 'phone', label: 'Phone', purpose: 'target', domains: ['notify'], optional: true, message: true }],
      questions: [] },
    candidates: { valve: { exact: true, items: [{ entity_id: 'switch.valve', name: 'Valve' }] },
      phone: { exact: true, items: [{ entity_id: 'notify.phone', name: 'Phone' }] } },
    preselect: {} };
  chat.draft = 'message notify.mobile_app_sm and notify.mobile_app_mi_9t_pro'; await chat.send();
  check('a missing message service is said in the plan', [...chat.root.querySelectorAll('.ai-plan .ai-note.warn')]
    .some(n => n.textContent.startsWith('notify.mobile_app_mi_9t_pro does not exist in this Home Assistant')));
  const phoneRole = [...chat.root.querySelectorAll('.ai-role')].find(r => r.querySelector('.ai-list[data-role="phone"]'));
  check('a phone role says why it is optional', !!phoneRole && phoneRole.textContent.includes('your message names the notify services'));

      && [...chat.root.querySelectorAll('[data-question="libi_start_message"] .ai-chip')].map(c => c.textContent).join('|') === 'A notification|Spoken|Notification and spoken|No', asked);
  }

  // ---------------------------------------------------------------- the zone chosen on the card (v3.84.0)
  {
    // [ADDED 2026-11-02, v3.84.0] The user's train reminder: the zone chosen on the dashboard card is a dropdown of the
    // user's zones, a local variable like the time; who must be there is a list of its own.
    const variable = (id, label, domains, extra = {}) => ({ id, label, purpose: 'condition', domains, device_classes: [],
      keywords: [], area_keywords: [], variable: true, ...extra });
    responses['libi/ai_plan'] = { plan: { reply: 'Pick who must be there.', intent: 'create', target_net: '', level: 'automation',
      name: 'Train reminder', questions: [], requirements: [], alternatives: [],
      roles: [{ id: 'who', label: 'Who must be there', purpose: 'condition', domains: ['device_tracker', 'person'], device_classes: [],
                keywords: [], area_keywords: [] },
              variable('selected_zone', 'The zone chosen', ['input_select'], { zone_choice: true }),
              variable('reminder_time', 'Reminder time', ['input_datetime'], { purpose: 'trigger' })],
      new_helpers: [{ role: 'selected_zone', domain: 'input_select', name: 'The zone chosen',
                      settings: { icon: 'mdi:map-marker', options: ['home', 'Guy at work', 'Yulia in Lod'] } },
                    { role: 'reminder_time', domain: 'input_datetime', name: 'Reminder time', settings: { has_time: true, has_date: false } }] },
      candidates: { who: { exact: true, items: [{ entity_id: 'person.guy', name: 'Guy', area: '', state: 'home' },
                                                { entity_id: 'person.yulia', name: 'Yulia', area: '', state: 'home' }] },
                    selected_zone: { exact: false, items: [] }, reminder_time: { exact: false, items: [] } } };
    chat._reset(); chat.draft = 'a spoken reminder at the zone I choose on the card'; await chat.send();
    const zoneRow = chat.root.querySelector('.ai-var[data-role="selected_zone"]');
    check('the zone chosen on the card says what it is', !!zoneRow
      && (zoneRow.querySelector('.ai-zone-choice')?.textContent || '') === 'The zone is chosen on the dashboard card, from a list of your zones - "home" is your Home zone. Who must be there is in it when their state is the zone chosen. When you add or rename a zone later, change this list too, in the helper\'s settings (Settings ▸ Helpers).',
      zoneRow && zoneRow.textContent);
    check('it is a new dropdown of the zones, created with the others', zoneRow.querySelector('.ai-var-name')?.value === 'The zone chosen'
      && zoneRow.textContent.includes('Dropdown · home / Guy at work / Yulia in Lod')
      && chat.root.querySelector('.ai-create-helpers')?.textContent === 'Create the 2 new variables', zoneRow.textContent);
    check('another variable says nothing of zones', !chat.root.querySelector('.ai-var[data-role="reminder_time"] .ai-zone-choice'));
    check('who must be there is a list of its own, not a variable', !chat.root.querySelector('.ai-var[data-role="who"]')
      && [...chat.root.querySelectorAll('.ai-role .ai-role-head strong')].some(s => s.textContent === 'Who must be there')
      && !chat.root.querySelector('.ai-list[data-role="who"]')?.parentElement.textContent.includes('No exact match'));
  }

  // ---------------------------------------------------------------- the message box fits its text (v3.61.0)
  {
    // A sidebar of a fixed height, as in the panel: the chat fills it and the box takes its room from the log.
    const bar = Object.assign(document.createElement('div'), { className: 'sidebar' });
    bar.style.height = '600px';
    const slot = bar.appendChild(Object.assign(document.createElement('div'), { className: 'ai-mount' }));
    document.body.appendChild(bar);
    chat._reset(); chat.attach(slot); chat.render(); await tick();
    const box = () => chat.root.querySelector('.ai-input');
    const type = (text) => { box().value = text; box().dispatchEvent(new Event('input')); };
    const high = () => box().getBoundingClientRect().height;
    const lines = (n) => Array.from({ length: n }, (_, i) => `line ${i + 1}: water the garden on the days I pick`).join('\n');
    const empty = high();
    check('an empty box is two lines high', empty >= 40 && empty < 70, empty);
    type(lines(8));
    const eight = high();
    check('the box grows with what is written', eight > empty * 2, `${empty} -> ${eight}`);
    check('all of it shows: nothing scrolls inside the box', box().scrollHeight <= box().clientHeight + 1 && getComputedStyle(box()).overflowY === 'hidden',
      `${box().scrollHeight} / ${box().clientHeight}`);
    check('what is typed is the draft', chat.draft === lines(8));
    type(lines(80));
    const body = chat.root.querySelector('.ai-body').clientHeight;
    check('a very long text stops at half the chat and scrolls', Math.abs(high() - Math.floor(body / 2)) <= 1 && box().scrollHeight > box().clientHeight
      && getComputedStyle(box()).overflowY === 'auto', `${high()} of ${body}`);
    check('the conversation keeps the other half', chat.root.querySelector('.ai-log').clientHeight >= body / 2 - 70, `${chat.root.querySelector('.ai-log').clientHeight} of ${body}`);
    type(lines(8)); chat.render(true);
    check('a redraw keeps the box as tall as its text', Math.abs(high() - eight) <= 1, `${high()} vs ${eight}`);
    const asked = calls.length;
    box().dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', shiftKey: true, bubbles: true }));
    check('Shift+Enter is a new line, not a send', calls.length === asked && chat.draft === lines(8));
    // Sent: the box is empty and small again.
    type('short');
    await chat.send();
    check('after sending the box is small again', Math.abs(high() - empty) <= 1, `${high()} vs ${empty}`);
    bar.remove();

    // A smaller sheet, as on a phone: the size watcher fits the box to the new room. A ResizeObserver reports at the
    // next frame, and the runner's virtual time gives no frame here (measured: no requestAnimationFrame in 300 ms),
    // so a chat is made with an observer the test holds, and its callback is called as the browser would call it.
    const watchers = [], RealObserver = window.ResizeObserver;
    window.ResizeObserver = class { constructor(cb) { this.cb = cb; watchers.push(this); } observe(el) { this.target = el; } };
    let sized;
    try { sized = new LibiAiChat(panel); } finally { window.ResizeObserver = RealObserver; }
    check('the chat watches its own size', watchers.length === 1 && watchers[0].target === sized.root);
    const sheet = Object.assign(document.createElement('div'), { className: 'sidebar' });
    sheet.style.height = '600px';
    const spot = sheet.appendChild(Object.assign(document.createElement('div'), { className: 'ai-mount' }));
    document.body.appendChild(sheet);
    sized.statusAsked = true; sized.attach(spot); sized.render();
    const box2 = sized.root.querySelector('.ai-input');
    box2.value = lines(80); box2.dispatchEvent(new Event('input'));
    const before = box2.getBoundingClientRect().height;
    sheet.style.height = '300px';
    watchers[0].cb([]);
    const room = sized.root.querySelector('.ai-body').clientHeight, after = box2.getBoundingClientRect().height;
    check('a smaller chat fits the box to its new room', after < before && Math.abs(after - Math.max(120, Math.floor(room / 2))) <= 1,
      `${before} -> ${after} of ${room}`);
    sheet.style.height = '600px';
    watchers[0].cb([]);
    check('a taller chat lets the box grow again', Math.abs(box2.getBoundingClientRect().height - before) <= 1,
      `${box2.getBoundingClientRect().height} vs ${before}`);
    sheet.remove();
  }
  check('no HTML injected anywhere', document.querySelectorAll('img').length === 0 && window.pwned === undefined);
} catch (err) {
  results.push({ name: 'harness threw', ok: false, detail: String(err && err.stack || err) });
}
const failed = results.filter(r => !r.ok);
document.getElementById('out').textContent = JSON.stringify({ passed: results.length - failed.length, failed }, null, 1);
</script>
</body></html>
