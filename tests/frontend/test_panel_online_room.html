<html><head><meta charset="utf-8"><meta name="window-size" content="1280,900"><title>libi online room (desktop)</title></head>
<body style="margin:0;">
<pre id="out">RUNNING</pre>
<script type="module">
import { roomChecks } from './online_fixture.js';
const results = [];
const check = (name, cond, detail = '') => { results.push({ name, ok: !!cond, detail: cond ? '' : String(detail) }); };
window.alert = () => {}; window.confirm = () => false; window.prompt = () => null;
customElements.define('ha-entity-picker', class extends HTMLElement {});
try {
  const { env } = await roomChecks(check);
  check('nothing was sent to Home Assistant', env.services.length === 0 && env.api.length === 0, JSON.stringify([env.services, env.api]));
} catch (err) {
  results.push({ name: 'harness threw', ok: false, detail: String(err && err.stack || err) });
}
const failed = results.filter(r => !r.ok);
document.getElementById('out').textContent = JSON.stringify({ passed: results.length - failed.length, failed }, null, 1);
</script>
</body></html>
