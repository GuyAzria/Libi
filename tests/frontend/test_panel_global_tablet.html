<html><head><meta charset="utf-8"><meta name="window-size" content="1000,800"><title>libi global layout (tablet)</title></head>
<body style="margin:0;">
<pre id="out">RUNNING</pre>
<script type="module">
import { makeHass, makePanel, layoutChecks, moveLayoutChecks } from './global_fixture.js';

const results = [];
const check = (name, cond, detail = '') => results.push({ name, ok: !!cond, detail: cond ? '' : String(detail) });
window.alert = () => {}; window.confirm = () => false;
customElements.define('ha-entity-picker', class extends HTMLElement {});
try {
  const { hass } = makeHass();
  const panel = await makePanel(hass, '780px');
  await layoutChecks(check, panel, false);
  await moveLayoutChecks(check, panel);
} catch (err) {
  results.push({ name: 'harness threw', ok: false, detail: String(err && err.stack || err) });
}
const failed = results.filter(r => !r.ok);
document.getElementById('out').textContent = JSON.stringify({ passed: results.length - failed.length, failed }, null, 1);
</script>
</body></html>
