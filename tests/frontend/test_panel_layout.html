<!doctype html>
<!--
  LIBI for Home Assistant - Copyright (C) 2026 Guy Azria - GPL-3.0-or-later
  [ADDED v1.0.0 | 2026-10-26] Purpose: The AI chat in the sidebar. Open, it fills the whole sidebar and
  the inspector is hidden; closed, the inspector is back. On the collapsed rail a CHAT AI button,
  written top to bottom with upright letters, opens the sidebar straight into the chat.
  [ADDED v1.2.0 | 2026-10-29] Purpose: A schedule is the CMP = block, no block of its own; the NET menu shows a
  NET's dashboard card with a Copy button.
  [ADDED v1.3.0 | 2026-10-29] Purpose: A schedule is the CMP DATETIME block (IN1 the date and time, IN2 the
  schedule), and the online view gives it power while the schedule is on.
-->
<html><head><meta charset="utf-8"><meta name="window-size" content="1280,900"><title>libi panel layout test</title></head>
<body style="margin:0; width:1280px; height:800px;">
<pre id="out">RUNNING</pre>
<script type="module">
// Static import: a dynamic import() never settles under --virtual-time-budget.
import '../../custom_components/libi/frontend/libi-panel.js';

const results = [];
const check = (name, cond, detail = '') => results.push({ name, ok: !!cond, detail: cond ? '' : String(detail) });
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
window.alert = () => {}; window.confirm = () => false; window.prompt = () => null;

const sent = [];
const CARD = 'type: entities\ntitle: Garden\nentities:\n- entity: schedule.garden\n';
const hass = {
  states: {}, entities: {}, devices: {}, areas: {}, themes: { darkMode: false }, language: 'en',
  user: { is_admin: true }, localize: (k) => k, callService: async () => {},
  connection: {
    sendMessagePromise: async (m) => {
      sent.push(m);
      if (m.type === 'libi/net_card') return { yaml: CARD };
      if (m.type === 'libi/preview_yaml') return { yaml: 'alias: Garden\n' };
      if (m.type === 'libi/ai_status') return { configured: true, mode: 'cloud', provider: 'gemini', model: 'gemini-x' };
      if (m.type === 'libi/load_automation') return { nets: [] };
      if (m.type === 'libi/project_list') return { projects: [] };
      return [];
    },
    subscribeEvents: async () => () => {}, subscribeMessage: async () => () => {},
  },
};

try {
  localStorage.clear();
  const panel = document.createElement('libi-panel');
  panel.style.height = '800px';
  document.body.appendChild(panel);
  panel.hass = hass;
  await sleep(300);
  const sr = panel.shadowRoot;
  const bar = () => sr.getElementById('sidebarContainer');
  const shown = (el) => !!el && getComputedStyle(el).display !== 'none';

  // Open (the default): the chat fills the sidebar.
  panel.aiChat.setOpen(true); panel._render(); await sleep(30);
  const top = sr.querySelector('.sidebar-top').getBoundingClientRect();
  const head = sr.querySelector('.ai-head').getBoundingClientRect();
  check('open chat marks the sidebar full', bar().classList.contains('ai-full'));
  check('open chat hides the inspector', !shown(sr.querySelector('.sidebar-content')));
  check('chat header sits right under the sidebar top, not halfway down', Math.abs(head.top - top.bottom) <= 3, `${head.top} vs ${top.bottom}`);
  const sbRect = bar().getBoundingClientRect(), mountRect = sr.getElementById('aiChatMount').getBoundingClientRect();
  check('chat reaches the bottom of the sidebar', Math.abs(mountRect.bottom - sbRect.bottom) <= 3, `${mountRect.bottom} vs ${sbRect.bottom}`);

  // A render of the panel rebuilds the sidebar; the layout must survive it.
  panel._render(); await sleep(30);
  check('full layout survives a panel render', bar().classList.contains('ai-full') && !shown(sr.querySelector('.sidebar-content')));

  // Closed: the inspector is back and the chat is only its header.
  panel.aiChat.setOpen(false); await sleep(30);
  check('closed chat brings the inspector back', !bar().classList.contains('ai-full') && shown(sr.querySelector('.sidebar-content')));
  check('closed chat keeps only its header', !sr.querySelector('.ai-body'));
  check('rail button hidden while the sidebar is open', !shown(sr.getElementById('railAiBtn')));


  // [ADDED 2026-10-27] Clicking an element while the AI chat is open shows that element's Inspector.
  {
    const net = panel.core.nets[0] || panel.core.mkNet('Net');
    if (!panel.core.nets.length) panel.core.nets.push(net);
    const el = panel.core.mkEl('contact_no', 'binary_sensor.door');
    net.rungs[0].elements = [el];
    panel.core.syncCounters();
    panel.aiChat.setOpen(true); panel._render(); await sleep(30);
    check('before the click the chat covers the sidebar', bar().classList.contains('ai-full'));
    const node = sr.querySelector(`.libi-el[data-eid="${el.id}"]`);
    check('the element is on the canvas', !!node);
    node.click(); await sleep(40);
    check('the click closes the chat', panel.aiChat.open === false && !bar().classList.contains('ai-full'));
    check('the click shows the Inspector', shown(sr.querySelector('.sidebar-content')));
    check('the Inspector shows the clicked element', !!sr.querySelector('#inspectorBody') &&
      sr.querySelector('.sidebar-content').textContent.includes('Element Properties'));
    check('the chat can be opened again', (panel.aiChat.setOpen(true), bar().classList.contains('ai-full')));
    panel._inspectedEl = null; panel._floatingMenu = null; panel.aiChat.setOpen(false); panel._render(); await sleep(20);
  }
  // Collapsed to the rail: CHAT AI, top to bottom, letters upright.
  panel._sidebarRail = true; panel._render(); await sleep(30);
  const btn = sr.getElementById('railAiBtn');
  check('rail shows CHAT AI', shown(btn) && btn.textContent.trim() === 'CHAT AI', btn && btn.textContent);
  const cs = btn && getComputedStyle(btn);
  check('CHAT AI is written top to bottom', cs && cs.writingMode === 'vertical-rl', cs && cs.writingMode);
  check('CHAT AI letters stand upright', cs && cs.textOrientation === 'upright', cs && cs.textOrientation);
  const r = btn.getBoundingClientRect();
  check('CHAT AI is taller than wide (vertical)', r.height > r.width * 2, `${r.width}x${r.height}`);
  check('CHAT AI fits inside the 40px rail', r.width <= 40 && r.left >= bar().getBoundingClientRect().left, `${r.left} ${r.width}`);
  check('rail hides the chat itself', !shown(sr.getElementById('aiChatMount')));

  // Pressing it opens the sidebar straight into the chat.
  btn.click(); await sleep(30);
  check('CHAT AI opens the sidebar', panel._sidebarRail === false && !bar().classList.contains('rail'));
  check('CHAT AI opens the chat', panel.aiChat.open === true && bar().classList.contains('ai-full'));
  check('chat is shown after CHAT AI', !!sr.querySelector('.ai-body') && shown(sr.getElementById('aiChatMount')));
  let stored = null; try { stored = localStorage.getItem('libi_sidebar_rail'); } catch (e) { /* */ }
  check('opened sidebar is remembered', stored === '0', stored);

  // [ADDED v1.1.0] The message box grows with a long text, up to half the chat and inside the sidebar; the
  // conversation keeps its room, and an emptied box is small again.
  {
    const box = () => sr.querySelector('.ai-input');
    const type = (text) => { box().value = text; box().dispatchEvent(new Event('input')); };
    const lines = (n) => Array.from({ length: n }, (_, i) => `line ${i + 1}: water the garden on the days I pick`).join('\n');
    const empty = box().getBoundingClientRect().height;
    const wide = box().getBoundingClientRect().width, barWide = bar().getBoundingClientRect().width;
    type(lines(6));
    check('the message box grows with the text', box().getBoundingClientRect().height > empty * 1.8 && box().scrollHeight <= box().clientHeight + 1,
      `${empty} -> ${box().getBoundingClientRect().height}`);
    type(lines(80));
    const body = sr.querySelector('.ai-body').clientHeight, high = box().getBoundingClientRect().height;
    check('a very long text stops at half the chat and scrolls', Math.abs(high - Math.max(120, Math.floor(body / 2))) <= 1 && box().scrollHeight > box().clientHeight,
      `${high} of ${body}`);
    check('the conversation still shows above the box', sr.querySelector('.ai-log').clientHeight >= 40, sr.querySelector('.ai-log').clientHeight);
    const bottom = bar().getBoundingClientRect().bottom + 1;
    check('the box and Send stay inside the sidebar', box().getBoundingClientRect().bottom <= bottom && sr.querySelector('.ai-send').getBoundingClientRect().bottom <= bottom);
    check('a long text widens neither the box nor the sidebar', box().getBoundingClientRect().width === wide && bar().getBoundingClientRect().width === barWide,
      `${box().getBoundingClientRect().width}/${wide} ${bar().getBoundingClientRect().width}/${barWide}`);
    type('');
    check('emptied, the box is small again', Math.abs(box().getBoundingClientRect().height - empty) <= 1, box().getBoundingClientRect().height);
  }

  // [CHANGED v1.3.0] A schedule is the CMP DATETIME block the importer draws for it (the date and time =
  // schedule.x while it is on), never a block of its own, and the online view gives it power while the schedule is
  // on. A contact on any other entity is still a contact. The NET menu builds the NET's dashboard card and shows it
  // with where to paste it and a Copy button.
  {
    panel.aiChat.setOpen(false);
    hass.states['schedule.garden'] = { entity_id: 'schedule.garden', state: 'off', attributes: { friendly_name: 'Garden schedule' } };
    hass.states['binary_sensor.door'] = { entity_id: 'binary_sensor.door', state: 'off', attributes: { friendly_name: 'Door' } };
    const net = panel.core.nets[0];
    const sched = panel.core.mkEl('cmp_eq', 'datetime');
    sched.sourceB = 'schedule.garden';
    sched.isTrigger = true;
    const door = panel.core.mkEl('contact_no', 'binary_sensor.door');
    net.rungs[0].elements = [sched, door];
    panel.core.syncCounters();
    panel._render(); await sleep(30);
    const node = sr.querySelector(`.libi-el[data-eid="${sched.id}"]`);
    const pins = node ? [...node.querySelectorAll('.pin-val')].map(p => p.textContent) : [];
    check('a schedule is the CMP DATETIME block: IN1 the date and time, IN2 the schedule', !!node
      && node.querySelector('.plc-header')?.textContent === 'CMP DATETIME =' && pins[0] === 'datetime' && pins[1] === 'schedule.garden',
      node && JSON.stringify([node.querySelector('.plc-header')?.textContent, pins]));
    const power = (state, type) => {
      hass.states['schedule.garden'].state = state;
      return panel.online.evaluate({ ...sched, type }, hass, Date.now()).power;
    };
    check('online it has power while the schedule is on, and the other way round for ≠', power('on', 'cmp_eq') === true
      && power('off', 'cmp_eq') === false && power('off', 'cmp_ne') === true && power('on', 'cmp_ne') === false);
    hass.states['schedule.garden'].state = 'off';
    check('there is no SCHEDULE block anywhere', ![...sr.querySelectorAll('.plc-header')].some(h => h.textContent.includes('SCHEDULE')));
    check('the trigger badge stays under it', !!node && !!node.querySelector('.trigger-bottom-lbl'));
    const doorNode = sr.querySelector(`.libi-el[data-eid="${door.id}"]`);
    check('a plain contact is still a contact', !!doorNode && !!doorNode.querySelector('.el-ico') && !!doorNode.querySelector('.el-lbl')
      && !doorNode.querySelector('.plc-header'));
    const cardBtn = sr.querySelector(`.card-net-btn[data-nid="${net.id}"]`);
    check('the NET menu offers the dashboard card', !!cardBtn && cardBtn.textContent.includes('Dashboard card'));
    cardBtn.click(); await sleep(30);
    check('the card is asked for this NET', sent.some(m => m.type === 'libi/net_card' && m.net && m.net.id === net.id));
    check('the panel shows the card, where to paste it and a Copy button', (sr.querySelector('.sidebar-hdr')?.textContent || '').startsWith('Dashboard card')
      && sr.querySelector('.yaml-preview-box')?.value === CARD && !!sr.getElementById('copyNetCard')
      && (sr.querySelector('.net-card-hint')?.textContent || '').includes('Add card'));
    sr.querySelector(`.show-yaml-btn[data-nid="${net.id}"]`).click(); await sleep(30);
    check('Show as YAML shows the YAML again, without the card', (sr.querySelector('.sidebar-hdr')?.textContent || '').startsWith('Net YAML')
      && !sr.getElementById('copyNetCard') && sr.querySelector('.yaml-preview-box')?.value === 'alias: Garden\n');
  }
} catch (err) {
  results.push({ name: 'harness threw', ok: false, detail: String(err && err.stack || err) });
}
const failed = results.filter(r => !r.ok);
document.getElementById('out').textContent = JSON.stringify({ passed: results.length - failed.length, failed }, null, 1);
</script>
</body></html>
