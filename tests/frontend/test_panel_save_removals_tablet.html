  from Home Assistant (RULE 36), left to right and right to left - in the screen, a list of 25 that scrolls inside it, a
  long name cut in its line, the three answers big enough to touch and in view. The checks are save_removals_fixture.js's
  removalLayoutChecks.

<html><head><meta charset="utf-8"><meta name="window-size" content="1000,800"><title>libi save removals layout (tablet)</title></head>
<body style="margin:0;">
<pre id="out">RUNNING</pre>
<script type="module">
import { makeSaveHass, makeSavePanel, removalLayoutChecks } from './save_removals_fixture.js';

const results = [];
const check = (name, cond, detail = '') => results.push({ name, ok: !!cond, detail: cond ? '' : String(detail) });
window.alert = () => {}; window.confirm = () => false;
customElements.define('ha-entity-picker', class extends HTMLElement {});
try {
  const { hass, state } = makeSaveHass();
  const panel = await makeSavePanel(hass, '780px');
  await removalLayoutChecks(check, panel, state);
} catch (err) {
  results.push({ name: 'harness threw', ok: false, detail: String(err && err.stack || err) });
}
const failed = results.filter(r => !r.ok);
document.getElementById('out').textContent = JSON.stringify({ passed: results.length - failed.length, failed }, null, 1);
</script>
</body></html>
